// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '23')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '34')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.23'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

ext {
    onnxRuntimeAndroidVersion = "1.24.3"
    onnxRuntimeExtensionsAndroidVersion = "0.13.0"
}

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.microsoft.onnxruntime" && details.requested.name == "onnxruntime-android") {
                details.useVersion rootProject.ext.onnxRuntimeAndroidVersion
                details.because("Pin ONNX Runtime Android to a concrete version for deterministic mobile builds")
            }
            if (details.requested.group == "com.microsoft.onnxruntime" && details.requested.name == "onnxruntime-android-qnn") {
                details.useVersion rootProject.ext.onnxRuntimeAndroidVersion
                details.because("Pin ONNX Runtime QNN Android to a concrete version for deterministic mobile builds")
            }
            if (details.requested.group == "com.microsoft.onnxruntime" && details.requested.name == "onnxruntime-extensions-android") {
                details.useVersion rootProject.ext.onnxRuntimeExtensionsAndroidVersion
                details.because("Pin ONNX Runtime Extensions Android to a concrete version for deterministic mobile builds")
            }
        }
    }
}
