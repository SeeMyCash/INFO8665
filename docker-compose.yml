# Docker Compose for INFO8665 – See My Cash Inference API
# Usage:
#   docker compose up --build
#   docker compose run --rm tests

services:
  api:
    build:
      context: ./training
      dockerfile: Dockerfile
    container_name: smc-inference-api
    ports:
      - "8080:8080"
    environment:
      - ENABLE_AWS_MODEL_SYNC=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: smc-prometheus
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  loki:
    image: grafana/loki:2.9.8
    container_name: smc-loki
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: smc-promtail
    depends_on:
      loki:
        condition: service_started
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:latest
    container_name: smc-grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/smc-api-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

  tests:
    build:
      context: ./training
      dockerfile: Dockerfile
    container_name: smc-e2e-tests
    depends_on:
      api:
        condition: service_healthy
    environment:
      - ENABLE_AWS_MODEL_SYNC=0
      - TEST_BASE_URL=http://api:8080
    entrypoint: ["pytest", "app/tests/", "-v", "--tb=short"]
    profiles:
      - test

volumes:
  grafana-data:
  loki-data:
